<!DOCTYPE html>
<html>
<head><title>Internal</title></head>
 <style>
  #j, #l, #li, #w{
	width:150px;
	padding:20px 0;
}  
  
#j{ background-color:black; 
color:white;
border:2px groove black;
}

#l{ background-color:purple; 
color:white;  
border-radius:10px 30px 0 0;
border-top:2px ridge grey;
border-right:2px solid black;
border-bottom:2px solid black;
border-left:2px ridge grey;}

#li{ background-color:red; 
color:white; 
border-radius:0 30px 30px 0;
border-top:2px ridge grey;
border-right:2px solid black;
border-bottom:2px solid black;
border-left:2px ridge grey;}

#w{ background-color:yellow; 
color:black; 
border-radius:0 0 30px 0; 
border-top:2px solid grey;
border-right:2px solid black;
border-bottom:2px solid black;
border-left:2px solid grey;}
 </style>
<body>
<input type="button" id="j" value="just">
<input type="button" id="l" value="looking">
<input type="button" id="li" value="like a">
<input type="button" id="w" value="wow!">
</body>
</html>
