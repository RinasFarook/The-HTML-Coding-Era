<!DOCTYPE html>
<html>
<head><title>Task 18</title>
	<style>
.container{margin:0 auto; width:500px;}

		.circle{width:100px;
		     height:100px;
		     border-radius:50%;		     
		     float:left;
		     position:relative;}

		 .fix{clear:both;}

		.blue{border:10px solid blue;}
		.black{border:10px solid black;margin-right:10px; margin-left:10px;z-index:1}
		.red{border:10px solid red;}
		.yellow{border:10px solid yellow;margin-left:70px;margin-top:-70px;}
		.green{border:10px solid green;margin-left:10px;margin-top:-70px;z-index:1}

	</style>

</head>

<body>
<div class="container">
	<div class="circle blue"></div>
	<div class="circle black"></div>
	<div class="circle red"></div>
	<div class="fix"></div>
	<div class="circle yellow"></div>
	<div class="circle green"></div>
</div>
</body>
</html>
