<!DOCTYPE html>
<head>
<title>HTML Table Demo</title>
</head>
<body>
<h1>HTML Table Demo</h1>
<h2>Table with Colspan and Rowspan</h2>

<table border=1>
 <tr>
   <th>Product</th>
   <th>Price</th>
   <th>Stock</th>
 </tr>

 <tr>
   <td>Apples</td>
   <td>$1.00</td>
   <td>Available</td>
 </tr>

 <tr>
   <td>Oranges</td>
   <td>$1.50</td>
   <td rowspan=2>Out of Stock</td>
 </tr>
 
 <tr>
   <td>Bananas</td>
   <td>$0.75</td>
 </tr>

<tr>
  <td colspan=3 align="center">End of List</td>
</tr>

</table>
</body>
</html>
