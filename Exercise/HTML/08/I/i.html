<!DOCTYPE html>
<html>
<head><title>Online Application Form</title></head>
<body>

<form method="post">
<table>
<tr>
<td><label for="Full Name">Full Name</label></br>
<input type="text" id="Full Name" name="Full Name" autofocus></td>
<td><label for="Name With Initial">Name With Initial</label></br>
<input type="text" id="Name With Initial" name="Name With Initial"></td>
</tr>



<tr>
<td><label for="Date of Birth">Date of Birth</label><br>
<input type="date" id="Date of Birth" name="Date of Birth"></td>
<td><label for="Gender">Gender</label></br>
<select name="Gender">
  <option value="">Select</option
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>
</td>
</tr>




</tr>

<tr>
<td><label for="Address">Address</label></td>
<td><label for="District">District</label></td>
</tr>

<tr>
<td rowspan=5><textarea cols="22" rows="7"> </textarea></td>
<td valign="top"><select name="District">
  <option value="">Select District</option
  <option value="Ampara">Ampara</option>
  <option value="Trincomalee">Trincomalee</option>
  <option value="Kandy">Kandy</option>
  <option value="Colombo">Colombo</option>
</td>
</select>
</tr>

<tr>
<td valign="top"><label for="Divisional Sectrateriate">Divisional Sectrateriate</label></td>
</tr>
<tr>
<td valign="top"><select name="Divisional Sectrateriate">
  <option value="">Select Divisional Sectrateriate</option
  <option value="Kalmunai">Kalmunai</option>
  <option value="Karaithivu">Karaithivu</option></td>
</select>
</tr>
<tr>
<td valign="top"><label for="Gramaniladari Division">Gramaniladari Division</label></td>
</tr>
<tr>
<td valign="top"><select name="Select Gramaniladan Division">
  <option value="">Gramaniladari Division</option
  <option value="Kalmunai">Kalmunai</option>
  <option value=>Karaithivu</option></td>
</select>
</tr>

<tr>
<td><label for="NIC Number">NIC Number</label></br>
<input type="text" id="NIC Number" name="NIC Number"></td>
<td><label for="Email Address">Email Address</label></br>
<input type="Email" id="Email Address" name="Email Address"></td>
</tr>

<tr>
<td><label for="Mobile Number">Mobile Number</label></br>
<input type="tel" id="Mobile Number" name="Mobile Number"></td>
<td><label for="WhatsApp Number">WhatsApp Number</label></br>
<input type="tel" id="Email Address" name="WhatsApp Number"></td>
</tr>

<tr>
<td colspan=2 align="center">
<input type="Button" value="Back">
<input type="Reset" value="Clear All">
<input type="Button" value="Next">
</td>
</tr>

</table>
</form>
</body>
</html>
